<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Ball-Strike</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        #game-layout {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        canvas {
            position: relative;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            z-index: 1;
        }
        
        /* --- АНИМАЦИИ ПОЯВЛЕНИЯ --- */
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.9) translateY(20px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        /* -------------------------- */

        #game-ui {
            width: 800px;
            display: none;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            box-sizing: border-box;
            z-index: 10;
            animation: fadeUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .hud-box {
            background: #000000;
            border: 4px solid #ffffff;
            padding: 8px 18px;
            display: flex;
            align-items: center;
            gap: 18px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .hp-cross {
            position: relative;
            width: 32px;
            height: 32px;
        }
        .hp-cross::before, .hp-cross::after {
            content: '';
            position: absolute;
            background-color: #e52424;
        }
        .hp-cross::before {
            top: 0; left: 11px; width: 10px; height: 32px;
        }
        .hp-cross::after {
            top: 11px; left: 0; width: 32px; height: 10px;
        }

        .score-icon {
            font-size: 32px;
            font-weight: 900;
            color: #ffe600;
            font-family: 'Segoe UI', Arial, sans-serif;
            line-height: 1;
            letter-spacing: 2px;
        }

        .hud-divider {
            width: 6px;
            height: 36px;
            background-color: #ffffff;
        }

        .hud-digits {
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 6px;
            color: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
            line-height: 1;
        }

        /* Всплывающее окно достижения */
        #achievement-popup {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.95);
            border: 2px solid #ffe600;
            border-radius: 8px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.8);
            z-index: 100;
            opacity: 0;
            transform: translateY(-20px) scale(0.95);
            pointer-events: none;
            transition: opacity 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #achievement-popup.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
        .ach-icon {
            font-size: 32px;
        }
        .ach-text h4 {
            margin: 0;
            color: #ffe600;
            font-size: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .ach-text h3 {
            margin: 2px 0;
            color: #fff;
            font-size: 16px;
        }
        .ach-text p {
            margin: 0;
            color: #aaa;
            font-size: 13px;
        }

        .menu-container {
            position: absolute;
            background: rgba(30, 30, 30, 0.90);
            padding: 40px;
            border-radius: 10px;
            border: 2px solid #444;
            text-align: center;
            box-shadow: 0 15px 50px rgba(0,0,0,0.9);
            min-width: 380px;
            z-index: 20; 
            backdrop-filter: blur(6px);
            animation: popIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .menu-container h1 {
            margin-top: 0;
            font-size: 34px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .menu-container h2 {
            margin-top: 0;
            color: #fff;
        }
        .menu-btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            background: #333;
            color: white;
            border: 2px solid #555;
            border-radius: 5px;
            font-size: 18px;
            transition: all 0.15s ease;
            cursor: pointer;
            text-decoration: none;
            box-sizing: border-box;
            position: relative;
        }
        .menu-btn:hover {
            background: #44ccff;
            border-color: #fff;
            color: black;
            font-weight: bold;
        }
        .menu-btn:active {
            transform: scale(0.96);
        }

        /* Меню достижений и статистики */
        #achievements-menu, #stats-menu {
            display: none;
            min-width: 440px;
        }
        .achievements-list {
            max-height: 350px;
            overflow-y: auto;
            text-align: left;
            margin: 15px 0;
            padding-right: 5px;
        }
        .ach-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(20, 20, 20, 0.6);
            border: 1px solid #444;
            border-radius: 6px;
            padding: 10px 15px;
            margin-bottom: 8px;
            transition: transform 0.2s, border-color 0.2s;
        }
        .ach-item:hover {
            transform: translateX(5px);
        }
        .ach-item.unlocked {
            border-color: #ffe600;
            background: rgba(255, 230, 0, 0.05);
        }
        .ach-item-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .ach-item-icon {
            font-size: 24px;
        }
        .ach-item-info h5 {
            margin: 0;
            font-size: 15px;
            color: #fff;
        }
        .ach-item.unlocked .ach-item-info h5 {
            color: #ffe600;
        }
        .ach-item-info p {
            margin: 2px 0 0 0;
            font-size: 12px;
            color: #aaa;
        }
        .ach-status {
            font-size: 13px;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 4px;
        }
        .ach-status.locked {
            color: #888;
            background: rgba(255,255,255,0.05);
        }
        .ach-status.unlocked {
            color: #000;
            background: #ffe600;
        }

        /* Стили для статистики */
        .stats-box {
            text-align: left;
            margin: 20px 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            background: rgba(20, 20, 20, 0.6);
            border: 1px solid #444;
            border-radius: 6px;
            padding: 12px 15px;
            font-size: 16px;
            transition: transform 0.2s;
        }
        .stat-row:hover {
            transform: translateX(5px);
            border-color: #44ccff;
        }
        .stat-value {
            font-weight: bold;
            color: #44ccff;
        }

        .discord-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px 15px 8px 15px;
        }
        .discord-icon {
            width: 22px;
            height: 16px;
            opacity: 0.5;
            margin-top: 4px;
            fill: currentColor;
            transition: opacity 0.2s;
        }
        .menu-btn:hover .discord-icon {
            opacity: 0.8;
        }
        
        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 15px 0;
            font-size: 16px;
        }
        select, input[type="color"], input[type="range"] {
            background: #222;
            color: white;
            border: 1px solid #555;
            padding: 5px;
            border-radius: 4px;
            outline: none;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        select:hover, input[type="color"]:hover, input[type="range"]:hover {
            border-color: #44ccff;
        }
        input[type="range"] {
            width: 130px;
        }

        .title-ball { color: white; }
        .title-strike { 
            color: black; 
            text-shadow: -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff; 
        }
    </style>
</head>
<body>

    <div id="game-layout">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        
        <!-- Всплывающая плашка достижений -->
        <div id="achievement-popup">
            <div class="ach-icon" id="ach-icon">🏆</div>
            <div class="ach-text">
                <h4>Достижение разблокировано!</h4>
                <h3 id="ach-title">Название</h3>
                <p id="ach-desc">Описание</p>
            </div>
        </div>

        <!-- Внешний HUD -->
        <div id="game-ui">
            <div class="hud-box">
                <div class="hp-cross"></div>
                <div class="hud-divider"></div>
                <div class="hud-digits" id="hp">100</div>
            </div>
            
            <div style="font-size: 14px; opacity: 0.8; color: white;">
                [Esc] — Пауза
            </div>

            <div class="hud-box">
                <div class="score-icon">P.</div>
                <div class="hud-divider"></div>
                <div class="hud-digits" id="score">0</div>
            </div>
        </div>
    </div>

    <!-- Главное меню -->
    <div id="main-menu" class="menu-container">
        <h1 id="menu-title">
            <span class="title-ball">Ball</span><span class="title-strike">-Strike</span>
        </h1>
        <p id="last-score" style="display: none; color: #aaa;">Последний счет: <span>0</span></p>
        <button class="menu-btn" id="btn-play">Играть</button>
        <button class="menu-btn" id="btn-achievements-main">Достижения</button>
        <button class="menu-btn" id="btn-stats">Статистика</button>
        <button class="menu-btn" id="btn-settings">Настройки</button>
        <a class="menu-btn discord-btn" href="https://discord.gg/CAnm7EbfND" target="_blank">
            <span>Связь</span>
            <svg class="discord-icon" viewBox="0 0 127.14 96.36">
                <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6,5.4,80.21h0A105.73,105.73,0,0,0,32.79,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.81,11.1,105.25,105.25,0,0,0,27.39-16.15c8.3-27.19-3.56-51.1-13.67-72.15ZM42.45,65.69C36.18,65.69,31,60,31,53s5.18-12.72,11.45-12.72S53.9,46,53.88,53,48.71,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5.18-12.72,11.45-12.72S96.14,46,96.13,53,91,65.69,84.69,65.69Z"/>
            </svg>
        </a>
    </div>

    <!-- Меню паузы -->
    <div id="pause-menu" class="menu-container" style="display: none;">
        <h1 style="color: #fff;">ПАУЗА</h1>
        <button class="menu-btn" id="btn-resume">Продолжить</button>
        <button class="menu-btn" id="btn-achievements-pause">Достижения</button>
        <button class="menu-btn" id="btn-pause-settings">Настройки</button>
        <button class="menu-btn" id="btn-quit" style="background-color: #5a1a1a;">Выйти в меню</button>
    </div>

    <!-- Меню достижений -->
    <div id="achievements-menu" class="menu-container">
        <h2>Достижения</h2>
        <div class="achievements-list" id="achievements-list-container"></div>
        <button class="menu-btn" id="btn-achievements-back">Назад</button>
    </div>

    <!-- Меню статистики -->
    <div id="stats-menu" class="menu-container">
        <h2>Статистика</h2>
        <div class="stats-box">
            <div class="stat-row">
                <span>Всего убийств:</span>
                <span class="stat-value" id="stat-total-kills">0</span>
            </div>
            <div class="stat-row">
                <span>Лучший счет:</span>
                <span class="stat-value" id="stat-high-score">0</span>
            </div>
            <div class="stat-row">
                <span>Количество смертей:</span>
                <span class="stat-value" id="stat-deaths">0</span>
            </div>
            <div class="stat-row">
                <span>Время в игре:</span>
                <span class="stat-value" id="stat-play-time">0 сек</span>
            </div>
        </div>
        <button class="menu-btn" id="btn-stats-back">Назад</button>
    </div>

    <!-- Меню настроек -->
    <div id="settings-menu" class="menu-container" style="display: none;">
        <h2>Настройки</h2>
        
        <div class="setting-row">
            <label>Сложность:</label>
            <select id="diff-select">
                <option value="easy">Нуб</option>
                <option value="normal">Про</option>
                <option value="hard">Глобал</option>
            </select>
        </div>

        <div class="setting-row">
            <label>Скин игрока:</label>
            <select id="skin-select">
                <option value="ct">Спецназ</option>
                <option value="t">Террорист</option>
                <option value="duck">Боевая Утка</option>
            </select>
        </div>

        <div class="setting-row">
            <label>Цвет карты:</label>
            <input type="color" id="color-map" value="#9aa0a6">
        </div>

        <div class="setting-row">
            <label>Цвет врагов:</label>
            <input type="color" id="color-enemy" value="#ff2200">
        </div>

        <div class="setting-row">
            <label>Форма прицела:</label>
            <select id="crosshair-shape">
                <option value="cross">Перекрестие</option>
                <option value="dot">Точка</option>
                <option value="circle">Круг с точкой</option>
            </select>
        </div>

        <div class="setting-row">
            <label>Цвет прицела:</label>
            <input type="color" id="crosshair-color" value="#00ff00">
        </div>

        <hr style="border-color: #444; margin: 20px 0;">

        <div class="setting-row">
            <label>Звук попадания:</label>
            <select id="hit-sound-select">
                <option value="rust">Хруст</option>
                <option value="headshot">Хедшот</option>
                <option value="hitmarker">Маркер</option>
                <option value="arcade">Аркада</option>
                <option value="none">Без звука</option>
            </select>
        </div>

        <div class="setting-row">
            <label>Громкость:</label>
            <input type="range" id="hit-volume" min="0" max="1" step="0.05" value="0.3">
        </div>

        <div style="display: flex; gap: 10px; margin-top: 20px;">
            <button class="menu-btn" id="btn-save" style="margin-top: 0; background-color: #2e8b57; border-color: #2e8b57;">Сохранить</button>
            <button class="menu-btn" id="btn-back" style="margin-top: 0;">Назад</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const gameUI = document.getElementById('game-ui');
        const mainMenu = document.getElementById('main-menu');
        const pauseMenu = document.getElementById('pause-menu');
        const settingsMenu = document.getElementById('settings-menu');
        const achievementsMenu = document.getElementById('achievements-menu');
        const statsMenu = document.getElementById('stats-menu');
        
        const scoreElement = document.getElementById('score');
        const hpElement = document.getElementById('hp');
        const menuTitle = document.getElementById('menu-title');
        const lastScoreDisplay = document.getElementById('last-score');
        
        const diffSelect = document.getElementById('diff-select');
        const skinSelect = document.getElementById('skin-select');
        const mapColorInput = document.getElementById('color-map');
        const enemyColorInput = document.getElementById('color-enemy');
        const crosshairShapeSelect = document.getElementById('crosshair-shape');
        const crosshairColorInput = document.getElementById('crosshair-color');
        
        const hitSoundSelect = document.getElementById('hit-sound-select');
        const hitVolumeInput = document.getElementById('hit-volume');

        // --- НАСТРОЙКИ ---
        let settings = {
            difficulty: 'normal',
            spawnRate: 800,
            enemySpeed: 1.5,
            mapColor: '#9aa0a6', 
            enemyColor: '#ff2200',
            skin: 'ct',
            crosshairShape: 'cross',
            crosshairColor: '#00ff00',
            hitSound: 'rust',
            hitVolume: 0.3
        };

        let savedSettings = localStorage.getItem('bs_settings');
        if (savedSettings) {
            settings = { ...settings, ...JSON.parse(savedSettings) };
        }

        diffSelect.value = settings.difficulty || 'normal';
        skinSelect.value = settings.skin;
        mapColorInput.value = settings.mapColor;
        enemyColorInput.value = settings.enemyColor;
        crosshairShapeSelect.value = settings.crosshairShape;
        crosshairColorInput.value = settings.crosshairColor;
        hitSoundSelect.value = settings.hitSound;
        hitVolumeInput.value = settings.hitVolume;

        // --- СТАТИСТИКА И ДОСТИЖЕНИЯ ---
        let stats = {
            totalKills: parseInt(localStorage.getItem('bs_totalKills')) || 0,
            highScore: parseInt(localStorage.getItem('bs_highScore')) || 0,
            deaths: parseInt(localStorage.getItem('bs_deaths')) || 0,
            playTime: parseInt(localStorage.getItem('bs_playTime')) || 0
        };

        let unlockedAchievements = new Set(JSON.parse(localStorage.getItem('bs_achievements')) || []);
        let achievementTimer = null;
        let achievementsSource = 'main';
        let playTimeInterval = null;

        const achievements = [
            { count: 1, title: "Первая кровь", desc: "Сделать первое убийство", icon: "🎯" },
            { count: 50, title: "Разогрев", desc: "Сделать 50 убийств", icon: "🔥" },
            { count: 100, title: "Убийца", desc: "Сделать 100 убийств", icon: "⚔️" },
            { count: 250, title: "Машина смерти", desc: "Сделать 250 убийств", icon: "💀" },
            { count: 500, title: "Терминатор", desc: "Сделать 500 убийств", icon: "🤖" },
            { count: 1000, title: "Легенда", desc: "Сделать 1000 убийств", icon: "👑" },
            { count: 2500, title: "Повелитель шаров", desc: "Сделать 2500 убийств", icon: "🪐" },
            { count: 5000, title: "Бог войны", desc: "Сделать 5000 убийств", icon: "⚡" },
            { count: 10000, title: "Неудержимый кошмар", desc: "Сделать 10000 убийств", icon: "🌌" },
            { count: 50000, title: "Повелитель измерений", desc: "Сделать 50000 убийств", icon: "🔮" },
            { count: 100000, title: "Абсолютное божество", desc: "Сделать 100000 убийств", icon: "👁️" }
        ];

        function saveGameData() {
            localStorage.setItem('bs_totalKills', stats.totalKills);
            localStorage.setItem('bs_highScore', stats.highScore);
            localStorage.setItem('bs_deaths', stats.deaths);
            localStorage.setItem('bs_playTime', stats.playTime);
            localStorage.setItem('bs_achievements', JSON.stringify([...unlockedAchievements]));
        }

        function formatTime(totalSeconds) {
            const mins = Math.floor(totalSeconds / 60);
            const secs = totalSeconds % 60;
            if (mins === 0) return `${secs} сек`;
            return `${mins} мин ${secs} сек`;
        }

        function renderStatsScreen() {
            document.getElementById('stat-total-kills').innerText = stats.totalKills;
            document.getElementById('stat-high-score').innerText = stats.highScore;
            document.getElementById('stat-deaths').innerText = stats.deaths;
            document.getElementById('stat-play-time').innerText = formatTime(stats.playTime);
        }

        function renderAchievementsList() {
            const container = document.getElementById('achievements-list-container');
            container.innerHTML = '';
            
            achievements.forEach(ach => {
                const isUnlocked = unlockedAchievements.has(ach.count);
                const item = document.createElement('div');
                item.className = `ach-item ${isUnlocked ? 'unlocked' : ''}`;
                
                item.innerHTML = `
                    <div class="ach-item-left">
                        <div class="ach-item-icon">${ach.icon}</div>
                        <div class="ach-item-info">
                            <h5>${ach.title}</h5>
                            <p>${ach.desc}</p>
                        </div>
                    </div>
                    <div class="ach-status ${isUnlocked ? 'unlocked' : 'locked'}">
                        ${isUnlocked ? 'Выполнено' : 'Закрыто'}
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function checkAchievements() {
            achievements.forEach(ach => {
                if (stats.totalKills === ach.count && !unlockedAchievements.has(ach.count)) {
                    unlockedAchievements.add(ach.count);
                    showAchievementPopup(ach.title, ach.desc, ach.icon);
                    saveGameData();
                }
            });
        }

        function showAchievementPopup(title, desc, icon) {
            const popup = document.getElementById('achievement-popup');
            document.getElementById('ach-title').innerText = title;
            document.getElementById('ach-desc').innerText = desc;
            document.getElementById('ach-icon').innerText = icon;
            
            if (achievementTimer) clearTimeout(achievementTimer);

            popup.classList.add('show');
            achievementTimer = setTimeout(() => {
                popup.classList.remove('show');
            }, 3500);
        }
        // --------------------------

        const originalTitleHTML = '<span class="title-ball">Ball</span><span class="title-strike">-Strike</span>';

        const crunchAudio = new Audio('crunch.mp3'); 
        const headshotAudio = new Audio('headshot.mp3'); 
        const popAudio = new Audio('pop.mp3'); 
        const deathAudio = new Audio('death.mp3'); 

        let isPlaying = false;
        let isPaused = false;
        let settingsSource = 'main'; 
        
        let score = 0;
        let lastFireTime = 0;
        let spawnerInterval;
        let bullets = [];
        let enemies = [];
        let audioCtx; 
        
        let menuEnemies = [];
        for (let i = 0; i < 20; i++) {
            menuEnemies.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                vx: (Math.random() - 0.5) * 4,
                vy: (Math.random() - 0.5) * 4,
                radius: 15
            });
        }

        const keys = { KeyW: false, KeyA: false, KeyS: false, KeyD: false };

        let mouseX = canvas.width / 2;
        let mouseY = canvas.height / 2;

        const player = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            radius: 15,
            speed: 4,
            angle: 0,
            hp: 100
        };

        // --- ВОСПРОИЗВЕДЕНИЕ ЗВУКОВ ИГРЫ ---
        function playHitSound() {
            if (settings.hitSound === 'none' || settings.hitVolume === 0) return;

            if (settings.hitSound === 'rust') {
                crunchAudio.volume = settings.hitVolume;
                crunchAudio.currentTime = 0;
                crunchAudio.play().catch(e => console.warn("Файл crunch.mp3 не найден"));
                return;
            }

            if (settings.hitSound === 'headshot') {
                headshotAudio.volume = settings.hitVolume;
                headshotAudio.currentTime = 0;
                headshotAudio.play().catch(e => console.warn("Файл headshot.mp3 не найден"));
                return;
            }

            if (!audioCtx) return;
            const time = audioCtx.currentTime;
            const masterGain = audioCtx.createGain();
            masterGain.gain.value = settings.hitVolume;
            masterGain.connect(audioCtx.destination);

            if (settings.hitSound === 'hitmarker') {
                const bufferSize = audioCtx.sampleRate * 0.05; 
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                const noiseFilter = audioCtx.createBiquadFilter();
                noiseFilter.type = 'highpass';
                noiseFilter.frequency.value = 3000;
                const noiseGain = audioCtx.createGain();
                noiseGain.gain.setValueAtTime(1, time);
                noiseGain.gain.exponentialRampToValueAtTime(0.01, time + 0.05); 

                noise.connect(noiseFilter).connect(noiseGain).connect(masterGain);
                noise.start(time);
            } else if (settings.hitSound === 'arcade') {
                const osc = audioCtx.createOscillator();
                osc.type = 'square';
                osc.frequency.setValueAtTime(800, time);
                osc.frequency.setValueAtTime(600, time + 0.05);
                const oscGain = audioCtx.createGain();
                oscGain.gain.setValueAtTime(0.5, time);
                oscGain.gain.exponentialRampToValueAtTime(0.01, time + 0.1);

                osc.connect(oscGain).connect(masterGain);
                osc.start(time);
                osc.stop(time + 0.1);
            }
        }

        // --- ЗВУК ИНТЕРФЕЙСА (КЛИКА POP) ---
        function playUIClick() {
            popAudio.volume = 0.15; // Делаем звук потише
            popAudio.currentTime = 0;
            popAudio.play().catch(e => console.warn("Файл pop.mp3 не найден"));
        }

        // Добавляем звук клика ко всем кнопкам меню
        document.querySelectorAll('.menu-btn').forEach(btn => {
            btn.addEventListener('mousedown', playUIClick);
        });

        // --- КУРСОР ---
        function updateOSCursor() {
            const shape = settings.crosshairShape;
            const color = settings.crosshairColor;
            let svg = '';

            if (shape === 'cross') {
                svg = `<svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><line x1="2" y1="12" x2="9" y2="12" stroke="${color}" stroke-width="2"/><line x1="15" y1="12" x2="22" y2="12" stroke="${color}" stroke-width="2"/><line x1="12" y1="2" x2="12" y2="9" stroke="${color}" stroke-width="2"/><line x1="12" y1="15" x2="12" y2="22" stroke="${color}" stroke-width="2"/></svg>`;
            } else if (shape === 'dot') {
                svg = `<svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="3" fill="${color}" /></svg>`;
            } else if (shape === 'circle') {
                svg = `<svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="8" stroke="${color}" stroke-width="2" fill="none"/><circle cx="12" cy="12" r="1.5" fill="${color}" /></svg>`;
            }
            
            const encoded = "data:image/svg+xml;base64," + btoa(svg);
            
            let styleEl = document.getElementById('dynamic-cursor-style');
            if (!styleEl) {
                styleEl = document.createElement('style');
                styleEl.id = 'dynamic-cursor-style';
                document.head.appendChild(styleEl);
            }
            styleEl.innerHTML = `* { cursor: url('${encoded}') 12 12, crosshair !important; }`;
        }
        updateOSCursor();

        // --- КНОПКИ МЕНЮ ---
        document.getElementById('btn-play').addEventListener('click', startGame);
        
        document.getElementById('btn-achievements-main').addEventListener('click', () => {
            achievementsSource = 'main';
            mainMenu.style.display = 'none';
            renderAchievementsList();
            achievementsMenu.style.display = 'block';
        });

        document.getElementById('btn-achievements-pause').addEventListener('click', () => {
            achievementsSource = 'pause';
            pauseMenu.style.display = 'none';
            renderAchievementsList();
            achievementsMenu.style.display = 'block';
        });

        document.getElementById('btn-achievements-back').addEventListener('click', () => {
            achievementsMenu.style.display = 'none';
            if (achievementsSource === 'main') mainMenu.style.display = 'block';
            else pauseMenu.style.display = 'block';
        });

        document.getElementById('btn-stats').addEventListener('click', () => {
            mainMenu.style.display = 'none';
            renderStatsScreen();
            statsMenu.style.display = 'block';
        });

        document.getElementById('btn-stats-back').addEventListener('click', () => {
            statsMenu.style.display = 'none';
            mainMenu.style.display = 'block';
        });

        document.getElementById('btn-settings').addEventListener('click', () => {
            settingsSource = 'main';
            mainMenu.style.display = 'none';
            settingsMenu.style.display = 'block';
        });

        document.getElementById('btn-pause-settings').addEventListener('click', () => {
            settingsSource = 'pause';
            pauseMenu.style.display = 'none';
            settingsMenu.style.display = 'block';
        });

        document.getElementById('btn-resume').addEventListener('click', () => {
            isPaused = false;
            pauseMenu.style.display = 'none';
        });

        document.getElementById('btn-quit').addEventListener('click', () => {
            isPaused = false;
            isPlaying = false;
            clearInterval(spawnerInterval);
            if (playTimeInterval) clearInterval(playTimeInterval);
            pauseMenu.style.display = 'none';
            gameUI.style.display = 'none';
            
            document.getElementById('achievement-popup').classList.remove('show');
            if (achievementTimer) clearTimeout(achievementTimer);

            menuTitle.innerHTML = originalTitleHTML;
            menuTitle.style.color = ""; 
            mainMenu.style.display = 'block';
            saveGameData();
        });

        document.getElementById('btn-save').addEventListener('click', () => {
            settings.difficulty = diffSelect.value;
            settings.mapColor = mapColorInput.value;
            settings.enemyColor = enemyColorInput.value;
            settings.skin = skinSelect.value;
            settings.crosshairShape = crosshairShapeSelect.value;
            settings.crosshairColor = crosshairColorInput.value;
            settings.hitSound = hitSoundSelect.value;
            settings.hitVolume = parseFloat(hitVolumeInput.value);
            
            if (settings.difficulty === 'easy') { settings.spawnRate = 1500; settings.enemySpeed = 1.0; }
            else if (settings.difficulty === 'normal') { settings.spawnRate = 800; settings.enemySpeed = 1.5; }
            else if (settings.difficulty === 'hard') { settings.spawnRate = 400; settings.enemySpeed = 2.5; }

            localStorage.setItem('bs_settings', JSON.stringify(settings));
            updateOSCursor();

            const btnSave = document.getElementById('btn-save');
            btnSave.innerText = "Сохранено!";
            btnSave.style.backgroundColor = "#28a745";
            btnSave.style.borderColor = "#28a745";
            
            setTimeout(() => {
                btnSave.innerText = "Сохранить";
                btnSave.style.backgroundColor = "#2e8b57";
                btnSave.style.borderColor = "#2e8b57";
            }, 1500);
        });

        document.getElementById('btn-back').addEventListener('click', () => {
            settings.difficulty = diffSelect.value;
            settings.mapColor = mapColorInput.value;
            settings.enemyColor = enemyColorInput.value;
            settings.skin = skinSelect.value;
            settings.crosshairShape = crosshairShapeSelect.value;
            settings.crosshairColor = crosshairColorInput.value;
            settings.hitSound = hitSoundSelect.value;
            settings.hitVolume = parseFloat(hitVolumeInput.value);
            
            if (settings.difficulty === 'easy') { settings.spawnRate = 1500; settings.enemySpeed = 1.0; }
            else if (settings.difficulty === 'normal') { settings.spawnRate = 800; settings.enemySpeed = 1.5; }
            else if (settings.difficulty === 'hard') { settings.spawnRate = 400; settings.enemySpeed = 2.5; }

            updateOSCursor();

            settingsMenu.style.display = 'none';
            if (settingsSource === 'main') mainMenu.style.display = 'block';
            else pauseMenu.style.display = 'block';
        });

        hitSoundSelect.addEventListener('change', () => {
            settings.hitSound = hitSoundSelect.value;
            playHitSound();
        });
        hitVolumeInput.addEventListener('change', () => {
            settings.hitVolume = parseFloat(hitVolumeInput.value);
            playHitSound();
        });

        // --- УПРАВЛЕНИЕ И МЫШЬ ---
        window.addEventListener('keydown', (e) => {
            if (keys.hasOwnProperty(e.code)) keys[e.code] = true;

            if (e.code === 'Escape' && isPlaying) {
                if (settingsMenu.style.display === 'block' && settingsSource === 'pause') {
                    document.getElementById('btn-back').click();
                } else if (achievementsMenu.style.display === 'block') {
                    document.getElementById('btn-achievements-back').click();
                } else {
                    isPaused = !isPaused;
                    pauseMenu.style.display = isPaused ? 'block' : 'none';
                }
            }
        });
        
        window.addEventListener('keyup', (e) => {
            if (keys.hasOwnProperty(e.code)) keys[e.code] = false;
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isPlaying || isPaused) return;
            const rect = canvas.getBoundingClientRect();
            
            mouseX = e.clientX - rect.left;
            mouseY = e.clientY - rect.top;

            mouseX = Math.max(0, Math.min(canvas.width, mouseX));
            mouseY = Math.max(0, Math.min(canvas.height, mouseY));

            player.angle = Math.atan2(mouseY - player.y, mouseX - player.x);
        });

        document.body.addEventListener('mousedown', () => {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        });

        canvas.addEventListener('mousedown', () => {
            if (!isPlaying || isPaused) return;
            const now = Date.now();
            if (now - lastFireTime > 150) {
                lastFireTime = now;
                const spread = (Math.random() - 0.5) * 0.05; 
                const bulletAngle = player.angle + spread;
                
                const barrelOffset = 40;
                bullets.push({
                    x: player.x + Math.cos(player.angle) * barrelOffset,
                    y: player.y + Math.sin(player.angle) * barrelOffset,
                    vx: Math.cos(bulletAngle) * 20,
                    vy: Math.sin(bulletAngle) * 20,
                    angle: bulletAngle
                });
            }
        });

        // --- ЛОГИКА ИГРЫ ---
        function startGame() {
            player.hp = 100;
            player.x = canvas.width / 2;
            player.y = canvas.height / 2;
            mouseX = player.x;
            mouseY = player.y - 100;
            
            score = 0;
            bullets = [];
            enemies = [];
            isPaused = false;
            
            scoreElement.innerText = score;
            hpElement.innerText = player.hp;
            mainMenu.style.display = 'none';
            gameUI.style.display = 'flex';
            
            isPlaying = true;

            clearInterval(spawnerInterval);
            if (playTimeInterval) clearInterval(playTimeInterval);

            spawnerInterval = setInterval(spawnEnemy, settings.spawnRate);
            playTimeInterval = setInterval(() => {
                if (isPlaying && !isPaused) {
                    stats.playTime++;
                }
            }, 1000);
        }

        function gameOver() {
            isPlaying = false;
            isPaused = false;
            clearInterval(spawnerInterval);
            if (playTimeInterval) clearInterval(playTimeInterval);
            
            // Воспроизводим звук смерти громче
            if (settings.hitSound !== 'none' && settings.hitVolume > 0) {
                deathAudio.volume = Math.min(settings.hitVolume * 2.5, 1.0); 
                deathAudio.currentTime = 0;
                deathAudio.play().catch(e => console.warn("Файл death.mp3 не найден"));
            }
            
            stats.deaths++;
            if (score > stats.highScore) {
                stats.highScore = score;
            }
            saveGameData();

            gameUI.style.display = 'none';
            
            document.getElementById('achievement-popup').classList.remove('show');
            if (achievementTimer) clearTimeout(achievementTimer);

            mainMenu.style.display = 'block';
            
            menuTitle.innerHTML = "ВЫ УБИТЫ";
            menuTitle.style.color = "#ff4444";
            
            lastScoreDisplay.style.display = 'block';
            lastScoreDisplay.querySelector('span').innerText = score;
        }

        function spawnEnemy() {
            if (!isPlaying || isPaused) return;
            
            const side = Math.random();
            let ex, ey;
            if (side < 0.25) { ex = Math.random() * canvas.width; ey = -30; }
            else if (side < 0.5) { ex = canvas.width + 30; ey = Math.random() * canvas.height; }
            else if (side < 0.75) { ex = Math.random() * canvas.width; ey = canvas.height + 30; }
            else { ex = -30; ey = Math.random() * canvas.height; }

            enemies.push({ x: ex, y: ey, radius: 15, speed: settings.enemySpeed });
        }

        function update() {
            if (!isPlaying) {
                menuEnemies.forEach(e => {
                    e.x += e.vx; e.y += e.vy;
                    if (e.x < e.radius) { e.x = e.radius; e.vx *= -1; }
                    if (e.x > canvas.width - e.radius) { e.x = canvas.width - e.radius; e.vx *= -1; }
                    if (e.y < e.radius) { e.y = e.radius; e.vy *= -1; }
                    if (e.y > canvas.height - e.radius) { e.y = canvas.height - e.radius; e.vy *= -1; }
                });
                return;
            }

            if (isPaused) return;

            if (keys.KeyW && player.y - player.radius > 0) player.y -= player.speed;
            if (keys.KeyS && player.y + player.radius < canvas.height) player.y += player.speed;
            if (keys.KeyA && player.x - player.radius > 0) player.x -= player.speed;
            if (keys.KeyD && player.x + player.radius < canvas.width) player.x += player.speed;

            player.angle = Math.atan2(mouseY - player.y, mouseX - player.x);

            bullets.forEach((b, i) => {
                b.x += b.vx; b.y += b.vy;
                if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) bullets.splice(i, 1);
            });

            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                const angle = Math.atan2(player.y - e.y, player.x - e.x);
                e.x += Math.cos(angle) * e.speed;
                e.y += Math.sin(angle) * e.speed;

                const playerDist = Math.hypot(e.x - player.x, e.y - player.y);
                if (playerDist - e.radius - player.radius < 0) {
                    enemies.splice(i, 1); 
                    player.hp -= 30;      
                    if (player.hp < 0) player.hp = 0;
                    hpElement.innerText = player.hp;

                    if (player.hp === 0) { gameOver(); return; }
                    continue; 
                }

                for (let bi = bullets.length - 1; bi >= 0; bi--) {
                    const b = bullets[bi];
                    const dist = Math.hypot(e.x - b.x, e.y - b.y);
                    
                    if (dist - e.radius - 5 < 0) {
                        enemies.splice(i, 1);
                        bullets.splice(bi, 1);
                        score += 100;
                        stats.totalKills++; 
                        scoreElement.innerText = score;
                        checkAchievements(); 
                        playHitSound();
                        break; 
                    }
                }
            }
        }

        function draw() {
            ctx.fillStyle = settings.mapColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (!isPlaying) {
                menuEnemies.forEach(e => {
                    ctx.beginPath(); ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
                    ctx.fillStyle = settings.enemyColor; ctx.fill();
                    ctx.strokeStyle = 'rgba(0, 0, 0, 0.3)'; ctx.lineWidth = 2; ctx.stroke();
                });
                ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                return;
            }

            bullets.forEach(b => {
                ctx.save(); 
                ctx.translate(b.x, b.y); 
                ctx.rotate(b.angle);
                
                ctx.beginPath();
                ctx.moveTo(-10, -4);
                ctx.lineTo(2, -4);
                ctx.quadraticCurveTo(10, -4, 12, 0); 
                ctx.quadraticCurveTo(10, 4, 2, 4);
                ctx.lineTo(-10, 4);
                ctx.closePath();
                
                ctx.fillStyle = '#ffcc00'; ctx.fill(); 
                ctx.fillStyle = '#b08d57'; ctx.fillRect(-10, -4, 8, 8);
                ctx.fillStyle = '#333'; ctx.fillRect(-2, -4, 2, 8);
                ctx.restore();
            });

            enemies.forEach(e => {
                ctx.beginPath(); ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
                ctx.fillStyle = settings.enemyColor; ctx.fill();
                ctx.strokeStyle = 'rgba(0, 0, 0, 0.5)'; ctx.lineWidth = 2; ctx.stroke();
            });

            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.rotate(player.angle);
            
            if (settings.skin === 'ct') {
                ctx.fillStyle = '#1a2b3c'; ctx.beginPath(); ctx.ellipse(0, 0, 16, 22, Math.PI / 2, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(22, -8, 6, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.arc(6, 12, 6, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#2a3b2a'; ctx.beginPath(); ctx.arc(0, 0, 13, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#44ccff'; ctx.fillRect(5, -7, 9, 14); 
            } else if (settings.skin === 't') {
                ctx.fillStyle = '#556b2f'; ctx.beginPath(); ctx.ellipse(0, 0, 16, 22, Math.PI / 2, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#d2b48c'; ctx.beginPath(); ctx.arc(22, -8, 6, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.arc(6, 12, 6, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(0, 0, 13, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#d2b48c'; ctx.fillRect(7, -6, 6, 12); 
            } else if (settings.skin === 'duck') {
                ctx.fillStyle = '#ffcc00'; ctx.beginPath(); ctx.ellipse(0, 0, 16, 22, Math.PI / 2, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(22, -8, 6, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.arc(6, 12, 6, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(0, 0, 13, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#ff8800'; ctx.beginPath(); ctx.moveTo(5, -6); ctx.lineTo(18, 0); ctx.lineTo(5, 6); ctx.fill();
            }

            ctx.save(); ctx.translate(12, 6); 
            ctx.fillStyle = '#8B4513'; ctx.fillRect(0, -4, 8, 6); ctx.fillRect(15, -3, 8, 4);  
            ctx.fillStyle = '#222222'; ctx.fillRect(4, -5, 25, 4); ctx.fillRect(10, 2, 4, 8); ctx.fillRect(27, -7, 2, 2);  
            ctx.restore(); ctx.restore();

            if (isPaused) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
